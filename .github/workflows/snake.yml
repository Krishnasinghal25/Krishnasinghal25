name: generate animation
on: {schedule: [{cron: "0 0 * * *"}], workflow_dispatch: {}, push: {branches: [main]}}
jobs: {generate: {permissions: {contents: write}, runs-on: ubuntu-latest, steps: [{uses: "Platane/snk@v3", id: "snake-gif", with: {github_user_name: "${{ github.repository_owner }}", outputs: "dist/github-contribution-grid-snake.svg?color_snake=7b2ff7&color_dots=ebedf0,c4b5fd,a78bfa,7c3aed,ff2e9f\ndist/github-contribution-grid-snake-dark.svg?color_snake=00d4ff&color_dots=161b22,4c2a86,7b2ff7,c026d3,ff2e9f"}}, {uses: "crazy-max/ghaction-github-pages@v4", with: {target_branch: output, build_dir: dist}, env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}}]}}
